<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rapport Hebdomadaire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .bg-grid-pattern {
        background-image: linear-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
        background-size: 50px 50px;
      }
    </style>
  </head>
  <body class="bg-gradient-to-br from-white via-sky-50 to-slate-100 min-h-screen">
    <div class="relative overflow-hidden min-h-screen">
      <div class="absolute inset-0 bg-grid-pattern opacity-10"></div>
      <a
        th:href="@{/}"
        class="absolute top-6 left-6 inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-white text-slate-700 border border-slate-200 hover:bg-slate-50 transition-colors shadow-sm"
      >
        <svg
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M10 19l-7-7m0 0l7-7m-7 7h18"
          ></path>
        </svg>
        <span>Accueil</span>
      </a>

      <div class="container mx-auto px-4 py-12 relative z-10 max-w-6xl">
        <div class="flex justify-end mb-4">
          <a
            th:href="@{/rapport/export}"
            class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-white text-slate-700 border border-slate-200 hover:bg-slate-50 transition-colors shadow-sm"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3"
              ></path>
            </svg>
            <span>Exporter Excel</span>
          </a>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <!-- Liste Employés -->
          <div class="lg:col-span-1 bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
            <h2 class="text-2xl font-semibold mb-4 text-slate-900">Employés</h2>
            <div class="space-y-2 max-h-[28rem] overflow-y-auto pr-1">
              <a
                th:each="e : ${employes}"
                th:href="@{/rapport(cin=${e.cin})}"
                class="block px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 hover:bg-slate-100 transition-colors"
              >
                <div class="flex items-center justify-between text-slate-900">
                  <span th:text="${e.nom}"></span>
                  <span class="text-blue-600 text-sm" th:text="${e.cin}"></span>
                </div>
              </a>
            </div>
          </div>

          <!-- Détails Rapport -->
          <div class="lg:col-span-2">
            <div
              class="bg-white rounded-2xl p-8 border border-slate-200 shadow-sm"
              th:if="${employe != null}"
            >
              <h1 class="text-3xl md:text-4xl font-bold mb-6 text-slate-900">
                Rapport Hebdomadaire
              </h1>

              <p class="mb-4 text-slate-600">
                <span class="font-semibold text-slate-900">Employé :</span>
                <span th:text="${employe.nom}"></span><br />
                <span class="font-semibold text-slate-900">Période :</span>
                <span th:text="${#dates.format(debut,'dd/MM/yyyy')}"></span> -
                <span th:text="${#dates.format(fin,'dd/MM/yyyy')}"></span>
              </p>

              <div class="flex flex-wrap items-center gap-3 mb-4">
                <h2 class="text-xl font-semibold text-slate-900">
                  Salaire ajusté : <span class="text-yellow-600" th:text="${total} + ' DH'"></span>
                </h2>
                <span
                  class="px-3 py-1 rounded-full bg-slate-50 text-slate-800 border border-slate-200"
                  th:text="${'Avances : ' + nbAvances + ' (' + totalAvances + ' DH)'}"
                ></span>
                <span
                  class="px-3 py-1 rounded-full bg-slate-50 text-slate-800 border border-slate-200"
                  th:text="${'Absences : ' + nbAbsences + ' (' + totalPenalites + ' DH)'}"
                ></span>
              </div>

              <a
                href="/employes"
                class="inline-flex items-center mt-2 px-4 py-2 rounded-xl bg-white text-slate-700 border border-slate-200 hover:bg-slate-50 transition-colors shadow-sm"
              >
                Retour
              </a>
            </div>

            <div
              class="bg-white rounded-2xl p-8 border border-slate-200 text-slate-600 shadow-sm"
              th:if="${employe == null}"
            >
              <h2 class="text-2xl font-semibold text-slate-900 mb-2">Sélectionnez un employé</h2>
              <p>
                Choisissez un employé dans la liste de gauche pour afficher son rapport
                hebdomadaire.
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
